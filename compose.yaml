name: icybreeze

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DOCKER_APP_PORT:-8080}:80"
    environment:
      APP_ENV: "${DOCKER_APP_ENV:-production}"
      APP_DEBUG: "${DOCKER_APP_DEBUG:-false}"
      APP_URL: "http://localhost:${DOCKER_APP_PORT:-8080}"
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-icybreeze_scheduling}"
      DB_USERNAME: "${DB_USERNAME:-icybreeze_app}"
      DB_PASSWORD: "${DB_PASSWORD}"
      RUN_SEEDER: "true"
      PAYPAL_ENABLED: "${PAYPAL_ENABLED:-false}"
      PAYPAL_MODE: "${PAYPAL_MODE:-sandbox}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      RESEND_FROM_ADDRESS: "${RESEND_FROM_ADDRESS:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
      GOOGLE_MAPS_GEOCODING_KEY: "${GOOGLE_MAPS_GEOCODING_KEY:-}"
      OPENWEATHER_API_KEY: "${OPENWEATHER_API_KEY:-}"
      OPENWEATHER_LATITUDE: "${OPENWEATHER_LATITUDE:-8.2280}"
      OPENWEATHER_LONGITUDE: "${OPENWEATHER_LONGITUDE:-124.2452}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    restart: unless-stopped
    volumes:
      - icybreeze-storage:/var/www/html/storage
      - icybreeze-runtime:/var/www/html/.docker-runtime

volumes:
  icybreeze-storage:
  icybreeze-runtime:
