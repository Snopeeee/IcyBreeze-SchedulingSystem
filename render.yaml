services:
  - type: web
    name: icybreeze-school-demo
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: IcyBreeze
      - key: APP_ENV
        value: staging
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: RENDER_APP_KEY
        generateValue: true
      - key: PORT
        value: "10000"
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_PORT
        value: "5432"
      - key: DB_URL
        fromDatabase:
          name: icybreeze-school-demo-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: RUN_SEEDER
        value: "true"
      - key: PAYPAL_ENABLED
        value: "true"
      - key: PAYPAL_MODE
        value: sandbox

databases:
  - name: icybreeze-school-demo-db
    plan: free
    databaseName: icybreeze_demo
    user: icybreeze_demo
    ipAllowList: []
